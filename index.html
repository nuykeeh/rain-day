<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>R.A.I.N. DAY</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }

  #rain-game {
    position: relative;
    width: 100%;
    height: 100vh;
    background: #000;
    cursor: none;              /* 전시장 커서 숨김 (PRD 7.1) */
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    overflow: hidden;
  }
  #rain-canvas { display: block; width: 100%; height: 100%; }

  /* 인터넷 없이 돌아야 한다 — 폰트는 로컬 파일만. (PRD 1-7) */
  @font-face {
    font-family: 'Noto Sans KR'; font-style: normal; font-weight: 400; font-display: swap;
    src: url('./fonts/NotoSansKR-Regular.woff2') format('woff2');
  }
  @font-face {
    font-family: 'Noto Sans KR'; font-style: normal; font-weight: 700; font-display: swap;
    src: url('./fonts/NotoSansKR-Bold.woff2') format('woff2');
  }
</style>
</head>
<body>
  <div id="rain-game"><canvas id="rain-canvas"></canvas></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
